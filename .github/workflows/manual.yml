name: Build Asahi Arch image

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space
        run: sudo rm -rf /opt/hostedtoolcache

      - name: Build image
        uses: addnab/docker-run-action@v3
        with:
          image: josdehaes/asahi-alarm-pkgbuild:latest
          options: >
            -v ${{ github.workspace }}:/home/user/PKGBUILDs
            --user 1001:116
            --privileged
          run: |
            set -ex
            sudo pacman -S --noconfirm \
              arch-install-scripts \
              wget \
              rsync \
              zip \
              btrfs-progs

            sudo ./build.sh

      - name: Upload Arch image
        uses: actions/upload-artifact@v4
        with:
          name: asahi-arch
          path: |
            images/asahi-base.zip
            images/uefi-only.zip
          retention-days: 7
